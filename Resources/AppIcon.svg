<?xml version="1.0" encoding="UTF-8"?>
<!-- 应用图标源文件（1024×1024，macOS 圆角矩形网格 824×824）。改完后运行 scripts/make-icon.sh 重新生成 AppIcon.icns。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f55"/>
      <stop offset="1" stop-color="#15161d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee38a"/>
      <stop offset="1" stop-color="#20b25a"/>
    </linearGradient>
    <clipPath id="clipBack"><circle cx="392" cy="430" r="150"/></clipPath>
    <clipPath id="clipFront"><circle cx="632" cy="430" r="150"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="412" rx="185" fill="url(#gloss)"/>

  <!-- 待机账号（灰） -->
  <g filter="url(#shadow)">
    <circle cx="392" cy="430" r="150" fill="#8e8f9a"/>
    <g clip-path="url(#clipBack)" fill="#3a3f55">
      <circle cx="392" cy="392" r="56"/>
      <path d="M392 462c-78 0-128 52-128 128v40h256v-40c0-76-50-128-128-128z"/>
    </g>
  </g>

  <!-- 当前账号（白，带绿色描边） -->
  <g filter="url(#shadow)">
    <circle cx="632" cy="430" r="164" fill="url(#accent)"/>
    <circle cx="632" cy="430" r="150" fill="#f5f6fa"/>
    <g clip-path="url(#clipFront)" fill="#2c3044">
      <circle cx="632" cy="392" r="56"/>
      <path d="M632 462c-78 0-128 52-128 128v40h256v-40c0-76-50-128-128-128z"/>
    </g>
  </g>

  <!-- 切换双箭头 -->
  <g fill="none" stroke="#f5f6fa" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M356 680h256M556 630l56 50-56 50"/>
    <path d="M668 770H412M468 720l-56 50 56 50"/>
  </g>
</svg>
